name: Fetch Insurance News

on:
  schedule:
    # UTC 0,6,12,18時 = 日本時間 9,15,21,3時 の1日4回
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: {}  # 手動実行もできるように

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news and build JSON
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --quiet --cached || git commit -m "Update news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
