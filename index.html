<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        #news-feed {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .news-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 6px solid #007bff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 123, 255, 0.15);
        }

        .news-date {
            font-size: 11px;
            color: #0056b3;
            background-color: #e3f2fd;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 12px;
            color: #111;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-description {
            font-size: 13px;
            color: #666;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: auto;
        }

        .news-card.skeleton {
            border-left-color: #e0e0e0;
            box-shadow: none;
            pointer-events: none;
        }
        .skeleton-line {
            background: linear-gradient(90deg, #eee 25%, #f5f5f5 37%, #eee 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 4px;
        }
        .skeleton-line.date { width: 90px; height: 20px; border-radius: 20px; margin-bottom: 15px; }
        .skeleton-line.title { width: 100%; height: 16px; margin-bottom: 8px; }
        .skeleton-line.title.short { width: 65%; }
        .skeleton-line.desc { width: 100%; height: 13px; margin-top: 14px; }

        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        #error-message {
            text-align: center;
            padding: 20px;
            color: #555;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            #news-feed { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="news-feed"></div>

<script>
    /*
     * ▼▼▼ ここを自分のGitHubユーザー名とリポジトリ名に書き換えてください ▼▼▼
     * 例: ユーザー名が "shun-dev"、リポジトリ名が "hokeneasy-news" の場合
     * https://shun-dev.github.io/hokeneasy-news/news.json になります
     */
    const NEWS_JSON_URL = 'https://YOUR_USERNAME.github.io/YOUR_REPO/news.json';
    /* ▲▲▲ ここまで ▲▲▲ */

    const CACHE_KEY = 'hokeneasy_news_cache_v2';
    const CACHE_TTL_MS = 60 * 60 * 1000; // 1時間
    const FETCH_TIMEOUT_MS = 8000;

    const container = document.getElementById('news-feed');

    function readCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            const isStale = (Date.now() - parsed.timestamp) > CACHE_TTL_MS;
            return { items: parsed.items, isStale };
        } catch (e) {
            return null;
        }
    }

    function writeCache(items) {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), items }));
        } catch (e) {}
    }

    function renderSkeleton(count = 6) {
        container.innerHTML = Array.from({ length: count }).map(() => `
            <div class="news-card skeleton">
                <div class="skeleton-line date"></div>
                <div class="skeleton-line title"></div>
                <div class="skeleton-line title short"></div>
                <div class="skeleton-line desc"></div>
            </div>
        `).join('');
    }

    function renderNews(items) {
        container.innerHTML = '';
        items.slice(0, 16).forEach(item => {
            const date = item.pubDate
                ? new Date(item.pubDate).toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' })
                : '';

            const card = document.createElement('a');
            card.href = item.link;
            card.target = '_blank';
            card.className = 'news-card';
            card.innerHTML = `
                <div class="news-date">${date}</div>
                <div class="news-title"></div>
                <div class="news-description"></div>
            `;
            card.querySelector('.news-title').textContent = item.title;
            card.querySelector('.news-description').textContent = item.description || '';

            container.appendChild(card);
        });
    }

    function renderError() {
        container.innerHTML = '<div id="error-message">ニュースを取得できませんでした。</div>';
    }

    async function fetchWithTimeout(url, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { signal: controller.signal, cache: 'no-store' });
        } finally {
            clearTimeout(timer);
        }
    }

    async function fetchFreshNews() {
        // GitHub PagesのCDNキャッシュ対策として時刻ベースのクエリを付与(10分単位)
        const bucket = Math.floor(Date.now() / (10 * 60 * 1000));
        const response = await fetchWithTimeout(`${NEWS_JSON_URL}?t=${bucket}`, FETCH_TIMEOUT_MS);
        if (!response.ok) throw new Error('news.json fetch failed: ' + response.status);
        const data = await response.json();
        if (!Array.isArray(data.items)) throw new Error('invalid news.json format');
        return data.items;
    }

    async function main() {
        const cached = readCache();

        if (cached && cached.items.length) {
            renderNews(cached.items);
            if (!cached.isStale) return;
        } else {
            renderSkeleton();
        }

        try {
            const items = await fetchFreshNews();
            if (items.length) {
                renderNews(items);
                writeCache(items);
            } else if (!cached) {
                renderError();
            }
        } catch (error) {
            if (!cached) {
                renderError();
            }
        }
    }

    main();
</script>

</body>
</html>
